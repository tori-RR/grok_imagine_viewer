[package]
name = "grok-imagine-viewer-tauri"
version = "0.1.0"
description = "Local Grok Imagine gallery viewer"
authors = ["tori-RR <52050507+tori-RR@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"
publish = false

[features]
environment-preview = []
# Explicit recovery-only build; default desktop downloads use the Go coordinator.
legacy-rust-download = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
fs2 = "=0.4.3"
getrandom = "=0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["dynamic-acl", "unstable"] }
tauri-plugin-single-instance = "=2.4.3"
url = "2"

[target.'cfg(windows)'.dependencies]
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
